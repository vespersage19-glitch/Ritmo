<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>Ritmo — Build Your Rhythm</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <p class="eyebrow">
          YOUR DAILY RHYTHM
        </p>

        <h1>Ritmo</h1>

        <p class="subtitle">
          Small habits. Better days.
        </p>

      </div>

      <div
        class="progress-circle"
        aria-label="Today's completion percentage"
      >
        <span id="progressPercent">0%</span>
      </div>

    </header>


    <!-- STATS -->

    <section class="stats">

      <article class="stat-card">

        <div class="stat-icon streak-icon">
          <span>✦</span>
        </div>

        <div>
          <strong id="bestStreak">0</strong>
          <small>Best Streak</small>
        </div>

      </article>


      <article class="stat-card">

        <div class="stat-icon done-icon">
          <span>✓</span>
        </div>

        <div>
          <strong id="completedCount">0</strong>
          <small>Done Today</small>
        </div>

      </article>


      <article class="stat-card">

        <div class="stat-icon habit-icon">
          <span>+</span>
        </div>

        <div>
          <strong id="totalHabits">0</strong>
          <small>Total Habits</small>
        </div>

      </article>

    </section>


    <!-- ADD HABIT -->

    <section class="add-section">

      <label
        class="sr-only"
        for="habitInput"
      >
        New habit
      </label>

      <input
        id="habitInput"
        type="text"
        placeholder="Add a habit..."
        maxlength="50"
        autocomplete="off"
      >

      <button
        id="addHabitBtn"
        type="button"
      >
        Add Habit
      </button>

    </section>


    <!-- HABIT TRACKER -->

    <section class="tracker-card">

      <div class="tracker-top">

        <div>

          <p class="section-label">
            WEEKLY TRACKER
          </p>

          <h2>Your Habits</h2>

        </div>


        <div class="today-label">
          <span id="todayLabel">
            Today
          </span>
        </div>

      </div>


      <!-- WEEK NAVIGATION -->

      <div class="week-navigation">

        <button
          id="previousWeekBtn"
          class="week-nav-button"
          type="button"
          aria-label="Previous week"
        >
          ‹
        </button>


        <div class="week-display">

          <strong id="weekLabel">
            This Week
          </strong>

        </div>


        <button
          id="nextWeekBtn"
          class="week-nav-button"
          type="button"
          aria-label="Next week"
        >
          ›
        </button>

      </div>


      <button
        id="currentWeekBtn"
        class="current-week-button"
        type="button"
      >
        Today
      </button>


      <!-- MATRIX -->

      <div class="matrix-scroll">

        <div
          id="habitMatrix"
          class="habit-matrix"
        ></div>

      </div>


      <!-- EMPTY STATE -->

      <div
        id="emptyState"
        class="empty-state"
        hidden
      >

        <div class="empty-icon">
          +
        </div>

        <h3>
          Your rhythm starts here
        </h3>

        <p>
          Add your first habit and start building consistency.
        </p>

      </div>

    </section>


    <!-- FOOTER -->

    <footer>

      <p>
        Ritmo · Build your rhythm.
      </p>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
